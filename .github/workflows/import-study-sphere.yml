name: Import StudySphere source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import the current StudySphere source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emmanuella3-design/studysphere.git /tmp/studysphere-source
          rsync -a --delete --exclude='.git' --exclude='README.md' /tmp/studysphere-source/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source is already up to date."
            exit 0
          fi
          git commit -m "Import StudySphere application source"
          git push origin HEAD:main
